[project]
name = "grafana-editor"
version = "0.1.0"
description = "MCP server for editing Grafana, authenticated via Microsoft Entra ID SSO."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click",
  "httpx",
  "hypercorn",
  "mcp>=2",
  "pyjwt[crypto]",
  "starlette",
]

[dependency-groups]
dev = [
  "httpx2",
  "pytest",
  "ruff",
  "ty",
]

[project.scripts]
grafana-editor = "grafana_editor:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
